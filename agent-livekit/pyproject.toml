[project]
name = "youplus_future_self_livekit"
version = "0.1.0"
description = "YOU+ Future Self accountability agent using LiveKit Agents"
requires-python = ">=3.10"
dependencies = [
    "livekit-agents>=0.8.0",
    "livekit-plugins-openai>=0.8.0",
    "livekit-plugins-silero>=0.8.0",
    "livekit-plugins-cartesia>=0.8.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pyright>=1.1.407",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
